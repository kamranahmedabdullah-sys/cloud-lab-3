<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .container {
      padding: 50px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple HTML web page</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Cloud Lab 3</h2>
      <p>This webpage was created using HTML and CSS.</p>
      <button onclick="alert('Hello!')">Click Me</button>
    </div>
  </div>

</body>
</html>
